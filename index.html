<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Curio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Curio: small games on one shelf. The chrome stays quiet so each game's own cover art does the talking. */
:root{--bg:#15132b;--panel:#211e40;--panel2:#2a2650;--ink:#f4f2ff;--soft:#a9a4d0;--line:rgba(255,255,255,.08);--gold:#ffd23f;--mint:#3ee0c5;
  --st:var(--safe-top,env(safe-area-inset-top,0px));--sb:var(--safe-bottom,env(safe-area-inset-bottom,0px));--display:'Bricolage Grotesque',system-ui,sans-serif;--ui:'Sora',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-user-select:none;user-select:none}
body{min-height:100vh;background:radial-gradient(60% 40% at 15% 0%,rgba(143,123,255,.22),transparent 70%),radial-gradient(50% 35% at 100% 20%,rgba(255,77,141,.14),transparent 70%),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 28px)}

/* header: the mark, the level ring, the streak */
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.mark{display:grid;grid-template-columns:repeat(4,9px);gap:3px}
.mark i{width:9px;height:9px;border-radius:3px}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1}
h1.one{font-size:40px;letter-spacing:-.03em}
.grow{flex:1}
.chip{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:14px;background:var(--panel);font-weight:700;font-size:14px}
.chip svg{width:18px;height:18px}
#lvl{position:relative;width:52px;height:52px;flex:0 0 auto}
#lvl svg{position:absolute;inset:0;transform:rotate(-90deg)}
#lvl b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px}
#lvl small{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--soft);white-space:nowrap}

/* today: three missions from three games */
.today{background:var(--panel);border-radius:24px;padding:16px 16px 10px;margin-bottom:14px;border:1px solid var(--line)}
.today h2{margin:0 0 2px;font-family:var(--display);font-weight:800;font-size:20px}
.today p{margin:0 0 10px;font-size:12.5px;color:var(--soft)}
.m{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.m .t{width:40px;height:40px;border-radius:12px;background-size:cover;background-position:center 30%;flex:0 0 auto;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.m .x{flex:1;min-width:0}
.m .x b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.m .bar{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
.m .bar i{display:block;height:100%;border-radius:3px}
.m .go{font-size:12px;font-weight:700;color:var(--soft);white-space:nowrap}
.m.done .x b{color:var(--soft);text-decoration:line-through;text-decoration-color:rgba(169,164,208,.6)}
.m.done .go{color:var(--mint)}

/* continue where you left off */
#cont{display:flex;align-items:center;gap:12px;width:100%;padding:10px;margin-bottom:18px;border-radius:20px;background:var(--panel2);text-align:left}
#cont .t{width:56px;height:56px;border-radius:14px;background-size:cover;background-position:center 30%}
#cont small{display:block;font-size:12px;color:var(--soft);font-weight:600}
#cont b{font-family:var(--display);font-weight:800;font-size:19px}
#cont .play{margin-left:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
#cont .play svg{width:20px;height:20px;margin-left:3px}

/* the shelf: every game as a little cartridge with its own cover */
.shelfHead{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.shelfHead h2{margin:0;font-family:var(--display);font-weight:800;font-size:20px}
.shelfHead span{font-size:12.5px;color:var(--soft)}
.tabs{display:flex;gap:5px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;height:34px;padding:0 10px;gap:4px;border-radius:999px;background:var(--panel);color:var(--soft);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.tabs button i{font-style:normal;font-size:11.5px;opacity:.7}
.tabs button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cart{position:relative;border-radius:22px;overflow:hidden;background:var(--panel);text-align:left;transition:transform .15s;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.cart:active{transform:scale(.97)}
.cart .cover{aspect-ratio:4/4.3;background-size:cover;background-position:center 18%}
.cart .lab{padding:10px 12px 12px;border-top:3px solid var(--c)}
.cart b{display:block;font-family:var(--display);font-weight:800;font-size:16.5px;line-height:1.1}
.cart small{display:block;margin-top:3px;font-size:11.5px;color:var(--soft);line-height:1.3;min-height:30px}
.cart .best{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:700}
.cart .best i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.cart .tag{position:absolute;top:10px;left:10px;padding:4px 9px;border-radius:999px;background:rgba(21,19,43,.82);font-size:11px;font-weight:700;color:var(--gold);backdrop-filter:blur(4px)}
footer{margin-top:22px;text-align:center;font-size:11.5px;color:rgba(169,164,208,.6)}
/* tablets: a wider page, missions and "continue" side by side, three to four cartridges per row, everything a little larger */
@media (min-width:700px){
  .wrap{max-width:1100px;padding-left:32px;padding-right:32px}
  h1{font-size:36px}h1.one{font-size:52px}
  .mark{grid-template-columns:repeat(4,12px);gap:4px}.mark i{width:12px;height:12px}
  .top2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
  #cont{margin-bottom:14px;padding:16px}
  #cont .t{width:84px;height:84px;border-radius:18px}
  #cont b{font-size:24px}
  .today h2,.shelfHead h2{font-size:24px}
  .m .x b{font-size:16px}
  .grid{grid-template-columns:repeat(3,1fr);gap:16px}
  .cart b{font-size:19px}.cart small{font-size:13px}
  .tabs button{height:40px;padding:0 16px;font-size:15px}
}
@media (min-width:1000px){ .grid{grid-template-columns:repeat(4,1fr)} }
/* the intro: a dark room, then the spotlight snaps on (with a flicker), light pools on the plinth, the glaze catches it,
   dust drifts in the beam, and the name settles in under it */
#intro{position:fixed;inset:0;z-index:50;background:#0a0718;display:grid;place-items:center;transition:opacity .5s ease}
#intro.out{opacity:0;pointer-events:none}
#intro .stage{position:relative;width:260px;height:260px;margin-top:-90px}
#intro svg{width:260px;height:260px;display:block;overflow:visible;transform:scale(1.35);transform-origin:50% 60%}
#intro .name{position:absolute;left:50%;top:300px;transform:translate(-50%,12px);opacity:0;font-family:var(--display);font-weight:800;font-size:50px;letter-spacing:-.03em;color:#fff4dc;white-space:nowrap;text-shadow:0 0 30px rgba(255,210,150,.35)}
#intro .tag{position:absolute;left:50%;top:364px;transform:translate(-50%,8px);opacity:0;font-size:14px;font-weight:600;color:var(--soft);white-space:nowrap}
#intro #cm-dark{opacity:.62}
#intro.go #cm-beam{animation:cmBeam 1.1s .25s steps(1,end) forwards, cmBeamGrow .9s .5s ease-out forwards}
#intro.go #cm-glow,#intro.go #cm-pool,#intro.go #cm-plinthlit,#intro.go #cm-bodylit{animation:cmOn .9s .55s ease-out forwards}
#intro.go #cm-dark{animation:cmOff .8s .5s ease-out forwards}
#intro.go #cm-spec{animation:cmSpec 1.2s .7s ease-out forwards}
#intro.go #cm-motes circle{animation:cmMote 3s linear infinite}
#intro.go #cm-motes circle:nth-child(2n){animation-duration:3.8s;animation-delay:-1.2s}
#intro.go #cm-motes circle:nth-child(3n){animation-duration:4.6s;animation-delay:-2.1s}
#intro.go .name{animation:cmName .7s 1.15s cubic-bezier(.2,1.2,.4,1) forwards}
#intro.go .tag{animation:cmName .6s 1.4s ease-out forwards}
#cm-beam,#cm-glow,#cm-pool,#cm-plinthlit,#cm-bodylit,#cm-spec{opacity:0}
#cm-motes circle{transform-box:fill-box}
@keyframes cmBeam{0%{opacity:0}8%{opacity:.7}14%{opacity:.15}24%{opacity:.85}30%{opacity:.4}40%{opacity:1}100%{opacity:1}}
@keyframes cmBeamGrow{from{filter:brightness(.7)}to{filter:brightness(1)}}
@keyframes cmOn{from{opacity:0}to{opacity:1}}
@keyframes cmOff{to{opacity:0}}
@keyframes cmSpec{0%{opacity:0}60%{opacity:.85}100%{opacity:.55}}
@keyframes cmMote{0%{transform:translate(0,-30px);opacity:0}20%{opacity:.9}100%{transform:translate(18px,140px);opacity:0}}
@keyframes cmName{to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){#intro.go *{animation-duration:.01s!important;animation-delay:0s!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="intro" hidden><div class="stage"><div id="introMark"></div><div class="name">Curio</div><div class="tag">small games, one shelf</div></div></div>
<div class="wrap">
  <header>
    <div class="mark" id="mark" aria-hidden="true"></div>
    <h1 class="one">Curio</h1>
    <div class="grow"></div>
    <div class="chip" id="streak" title="Days in a row"><svg viewBox="0 0 24 24" fill="#ff8a3d"><path d="M12 2c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5.5 1-8.5z"/></svg><span id="streakN">0</span></div>
    <div id="lvl" aria-label="Your level"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5"/><circle id="ring" cx="26" cy="26" r="22" fill="none" stroke="#ffd23f" stroke-width="5" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="138.2"/></svg><b id="lvlN">1</b><small id="lvlX">0 / 100 XP</small></div>
  </header>

  <div class="top2">
  <section class="today">
    <h2>Today's missions</h2>
    <p>100 XP each, and 150 more for all three. New ones tomorrow.</p>
    <div id="missions"></div>
  </section>

  <button id="cont" hidden></button>
  </div>

  <div class="shelfHead"><h2>Games</h2><span id="shelfNote"></span></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="grid" id="grid"></div>
  <footer>Every round in any game counts toward your level.</footer>
</div>
<script>// Curio: the shared layer every page loads (the hub and each game).
// One save ('arcade-v1') holds the player's level, daily missions and streak; each game keeps its own save untouched.
window.Arcade = (() => {
  const KEY = 'arcade-v1';
  const GAMES = [
    {id:'neon-2048', name:'Neon 2048', blurb:'Slide and merge tiles of light', color:'#ff8a3d', cat:'puzzle'},
    {id:'neon-blocks', name:'Neon Blocks', blurb:'Stack, clear and light up the well', color:'#ff4d8d', cat:'puzzle'},
    {id:'neon-orbit', name:'Neon Orbit', blurb:'Turn the ring, fire, light up the core', color:'#ffd23f', cat:'reflex'},
    {id:'neon-fuse', name:'Neon Fuse', blurb:'Turn the wires, keep the spark alive', color:'#3ee0c5', cat:'puzzle'},
    {id:'neon-tilt', name:'Neon Tilt', blurb:'Tilt the board, roll every ball home', color:'#5aa9ff', cat:'puzzle'},
    {id:'paper-echo', name:'Paper Echo', blurb:'Paper birds sing, you sing it back', color:'#f2b84b', cat:'calm'},
    {id:'afterimage', name:'Afterimage', blurb:'Your past self is right behind you', color:'#8f7bff', cat:'reflex'},
    {id:'halves', name:'Halves', blurb:'One swipe, two equal halves', color:'#ffd400', cat:'puzzle'},
    {id:'tightrope', name:'Tightrope', blurb:'Keep your balance high above the city', color:'#ff6b5b', cat:'reflex'},
    {id:'lily', name:'Lily', blurb:'A frog, a pond, a night of fireflies', color:'#e8c26a', cat:'reflex'},
    {id:'steep', name:'Steep', blurb:'A little tea house, poured by hand', color:'#d9733f', cat:'calm'},
    {id:'deckload', name:'Deckload', blurb:'Load her up, keep her level', color:'#e8a33a', cat:'physics'},
    {id:'tidepool', name:'Tidepool', blurb:'Send the tide, settle every creature', color:'#3fb8c4', cat:'puzzle'},
    {id:'kite', name:'Kite', blurb:'Ride the gusts, mind the line', color:'#ff7a59', cat:'reflex'},
    {id:'neon-pour', name:'Neon Pour', blurb:'Pour the light, sort every colour', color:'#c86bff', cat:'puzzle'},
    {id:'neon-bolts', name:'Neon Bolts', blurb:'Spin the nuts, light every bolt', color:'#3ee0c5', cat:'puzzle'},
    {id:'pottery', name:'Pottery', blurb:'Throw it, fire it, put it on the shelf', color:'#d9733f', cat:'calm'},
  ];
  // shelf tabs, in the order they appear
  const CATS = [{id:'puzzle', name:'Puzzle'}, {id:'reflex', name:'Reflex'}, {id:'calm', name:'Calm'}, {id:'physics', name:'Build'}];
  const byId = Object.fromEntries(GAMES.map(g => [g.id, g]));
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const dayNum = s => Math.round(new Date(s + 'T12:00:00').getTime() / 864e5);

  let S;
  function load(){
    try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ S = null; }
    S = Object.assign({xp:0, runs:{}, best:{}, played:0, streak:{last:'', days:0}, daily:null, last:null, noads:false, seen:false}, S || {});
  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
  load();

  // levels: each one asks a little more than the last
  const need = L => 100 + (L - 1) * 40;
  function level(){ let L = 1, x = S.xp; while (x >= need(L)){ x -= need(L); L++; } return {level:L, into:x, need:need(L)}; }

  // three missions a day, from three different games, the same for the whole day
  function rng(seed){ let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function daily(){
    const d = today();
    if (S.daily && S.daily.date === d) return S.daily;
    const R = rng(dayNum(d) * 7919), pool = GAMES.slice();
    for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(R() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const list = pool.slice(0, 3).map((g, i) => {
      const best = S.best[g.id] || 0, kind = i === 0 ? 'play' : best > 0 && R() < .6 ? 'score' : i === 2 ? 'best' : 'play';
      if (kind === 'score') return {game:g.id, kind, target:Math.max(1, Math.round(best * (.45 + R() * .2))), prog:0, done:false};
      if (kind === 'best') return {game:g.id, kind, target:1, prog:0, done:false};
      return {game:g.id, kind:'play', target:2 + Math.floor(R() * 2), prog:0, done:false};
    });
    S.daily = {date:d, list, bonus:false}; save(); return S.daily;
  }
  const missionText = m => { const n = byId[m.game].name;
    return m.kind === 'play' ? `Play ${m.target} rounds of ${n}` : m.kind === 'score' ? `Score ${m.target.toLocaleString('en-US')} in ${n}` : `Beat your best in ${n}`; };

  // a finished round from any game: XP, missions, streak
  function report(game, r){
    r = r || {}; const score = +r.score || 0, newBest = !!r.newBest;
    S.runs[game] = (S.runs[game] || 0) + 1; S.played++; S.last = game;
    if (score > (S.best[game] || 0)) S.best[game] = score;
    const before = level().level; let gain = 20 + (newBest ? 25 : 0); const done = [];
    for (const m of daily().list){ if (m.done || m.game !== game) continue;
      if (m.kind === 'play') m.prog++; else if (m.kind === 'score') m.prog = Math.max(m.prog, score); else if (newBest) m.prog = 1;
      if (m.prog >= m.target){ m.done = true; gain += 100; done.push(missionText(m)); } }
    if (!S.daily.bonus && S.daily.list.every(m => m.done)){ S.daily.bonus = true; gain += 150; done.push('All three missions'); }
    // a day with at least one finished round keeps the streak going
    const d = today(); if (S.streak.last !== d){ S.streak.days = S.streak.last && dayNum(d) - dayNum(S.streak.last) === 1 ? S.streak.days + 1 : 1; S.streak.last = d; }
    S.xp += gain; save();
    const after = level().level;
    return {gain, done, levelUp:after > before ? after : 0};
  }
  const streak = () => { const d = today(); return S.streak.last && dayNum(d) - dayNum(S.streak.last) <= 1 ? S.streak.days : 0; };
  return {GAMES, CATS, byId, get state(){ return S; }, level, daily, missionText, report, streak, save, reload:load};
})();
</script>
<script>// Curio's mark: a glazed vase on a velvet plinth, caught in a spotlight that falls from above, like a curio in a
// museum case. One drawing for the app icon, the launch screen (lights off) and the animated intro (lights on).
// curioMark({lit, bg, ids, scale}) returns SVG markup in a 1024 viewBox. `lit` 0..1 is the spotlight, `bg` paints
// the square icon background, `ids` names the parts the intro animates (cm-beam, cm-pool, cm-glow, cm-spec, ...).
window.curioMark = function({lit = 1, bg = true, ids = false, scale = 1} = {}){
  const id = k => ids ? ` id="cm-${k}"` : '';
  const on = (k, v = 1) => `${id(k)}${ids ? '' : ` opacity="${(v * lit).toFixed(3)}"`}`;
  const motes = [[488, 300, 3.2], [548, 360, 2.4], [506, 452, 2], [566, 520, 2.8], [458, 560, 2.2], [530, 248, 1.8], [470, 410, 1.6]]
    .map(([x, y, r], i) => `<circle cx="${x}" cy="${y}" r="${r * 2}" fill="#fff4d6" opacity="${(.35 + (i % 3) * .2).toFixed(2)}"/>`).join('');
  return `<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<defs>
  <radialGradient id="cmBg" cx="50%" cy="62%" r="75%"><stop offset="0" stop-color="#2a1d4f"/><stop offset=".55" stop-color="#160f2e"/><stop offset="1" stop-color="#0a0718"/></radialGradient>
  <linearGradient id="cmBeam" gradientUnits="userSpaceOnUse" x1="0" y1="-900" x2="0" y2="840"><stop offset="0" stop-color="#fff6dc" stop-opacity=".25"/><stop offset=".55" stop-color="#fff0cc" stop-opacity=".75"/><stop offset=".8" stop-color="#ffe0a8" stop-opacity=".4"/><stop offset="1" stop-color="#ffcf8a" stop-opacity=".08"/></linearGradient>
  <linearGradient id="cmCore" gradientUnits="userSpaceOnUse" x1="0" y1="-900" x2="0" y2="700"><stop offset="0" stop-color="#fffbef" stop-opacity=".9"/><stop offset="1" stop-color="#fff0c8" stop-opacity="0"/></linearGradient>
  <radialGradient id="cmPool" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff2cf" stop-opacity=".95"/><stop offset=".5" stop-color="#ffc98a" stop-opacity=".45"/><stop offset="1" stop-color="#ff9e6e" stop-opacity="0"/></radialGradient>
  <radialGradient id="cmGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".55"/><stop offset="1" stop-color="#8a5cff" stop-opacity="0"/></radialGradient>
  <linearGradient id="cmPlinthTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2a6e"/><stop offset="1" stop-color="#2a1d52"/></linearGradient>
  <linearGradient id="cmPlinth" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#140d2c"/><stop offset=".5" stop-color="#2d1f5c"/><stop offset="1" stop-color="#120b28"/></linearGradient>
  <linearGradient id="cmPlinthLit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".55"/><stop offset=".35" stop-color="#ffb07a" stop-opacity="0"/></linearGradient>
  <linearGradient id="cmBody" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d1f5a"/><stop offset=".3" stop-color="#1f4bb4"/><stop offset=".55" stop-color="#2d63d6"/><stop offset=".8" stop-color="#173a92"/><stop offset="1" stop-color="#0a1a4a"/></linearGradient>
  <linearGradient id="cmBodyLit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6b8" stop-opacity=".75"/><stop offset=".3" stop-color="#ffd59a" stop-opacity=".18"/><stop offset=".6" stop-color="#ffd59a" stop-opacity="0"/></linearGradient>
  <linearGradient id="cmFoot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a5a3a"/><stop offset=".5" stop-color="#d9a273"/><stop offset="1" stop-color="#7a4c30"/></linearGradient>
  <linearGradient id="cmGold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a6a1e"/><stop offset=".5" stop-color="#ffe08a"/><stop offset="1" stop-color="#8a5c18"/></linearGradient>

<script>
(() => {
  const A = window.Arcade, $ = id => document.getElementById(id);
  const open = id => { location.href = 'games/' + id + '.html'; };
  const cover = id => THUMBS[id] ? `url(${THUMBS[id]})` : 'none';
  $('shelfNote').textContent = `${A.GAMES.length} games, one level`;
  $('mark').innerHTML = A.GAMES.map(g => `<i style="background:${g.color}"></i>`).join('');
  let cat = 'all'; try { cat = sessionStorage.getItem('arcade-tab') || 'all'; } catch(_){}
  function paint(){
    A.reload();
    const L = A.level(); $('lvlN').textContent = L.level; $('lvlX').textContent = `${L.into} / ${L.need} XP`;
    $('ring').style.strokeDashoffset = 138.2 * (1 - L.into / L.need);
    $('streakN').textContent = A.streak();
    const d = A.daily();
    $('missions').innerHTML = d.list.map(m => { const g = A.byId[m.game], k = Math.min(1, m.prog / m.target);
      return `<button class="m${m.done ? ' done' : ''}" data-g="${m.game}"><span class="t" style="background-image:${cover(m.game)}"></span>
        <span class="x"><b>${A.missionText(m)}</b><span class="bar"><i style="width:${k * 100}%;background:${g.color}"></i></span></span>
        <span class="go">${m.done ? 'Done' : m.kind === 'score' ? `${Math.min(m.prog, m.target).toLocaleString('en-US')}` : `${m.prog} / ${m.target}`}</span></button>`; }).join('');
    const S = A.state, last = S.last && A.byId[S.last];
    $('cont').hidden = !last;
    if (last) $('cont').innerHTML = `<span class="t" style="background-image:${cover(last.id)}"></span><span><small>Continue</small><b>${last.name}</b></span><span class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></span>`;
    const list = cat === 'all' ? A.GAMES : A.GAMES.filter(g => g.cat === cat);
    $('tabs').innerHTML = [{id:'all', name:'All'}, ...A.CATS].map(c => `<button role="tab" class="${c.id === cat ? 'on' : ''}" data-cat="${c.id}" aria-selected="${c.id === cat}">${c.name} <i>${c.id === 'all' ? A.GAMES.length : A.GAMES.filter(g => g.cat === c.id).length}</i></button>`).join('');
    $('grid').innerHTML = list.map(g => { const best = S.best[g.id] || 0, mission = d.list.some(m => m.game === g.id && !m.done);
      return `<button class="cart" style="--c:${g.color}" data-g="${g.id}">${mission ? '<span class="tag">Mission</span>' : ''}<div class="cover" style="background-image:${cover(g.id)}"></div>
        <div class="lab"><b>${g.name}</b><small>${g.blurb}</small><span class="best"><i></i>${best ? 'Best ' + best.toLocaleString('en-US') : 'New'}</span></div></button>`; }).join('');
  }
  document.addEventListener('click', e => { const tb = e.target.closest('[data-cat]'); if (tb){ cat = tb.dataset.cat; try { sessionStorage.setItem('arcade-tab', cat); } catch(_){} paint(); return; }
    const b = e.target.closest('[data-g]'); if (b){ open(b.dataset.g); return; } if (e.target.closest('#cont')) open(A.state.last); });
  addEventListener('pageshow', paint); paint();
  // the intro plays once per launch (not when coming back from a game); on iOS it starts when the native launch copy lifts
  let seen = false; try { seen = sessionStorage.getItem('curio-intro') === '1'; sessionStorage.setItem('curio-intro', '1'); } catch(e){}
  const intro = $('intro');
  if (!seen && window.curioMark){
    intro.hidden = false; $('introMark').innerHTML = curioMark({lit:0, ids:true, bg:false});
    let started = false, ended = false;
    const end = () => { if (ended) return; ended = true; intro.classList.add('out'); setTimeout(() => intro.remove(), 500); };
    window.__introStart = () => { if (started) return; started = true; requestAnimationFrame(() => intro.classList.add('go')); setTimeout(end, 2700); };
    intro.addEventListener('click', () => { window.__introStart(); end(); });
    if (!(window.PLATFORM && PLATFORM.name === 'ios')) setTimeout(window.__introStart, 250);
    setTimeout(window.__introStart, 2500);   // never wait on a native signal for long
  } else intro.remove();
})();
</script>
</body>
