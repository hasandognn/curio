<!doctype html>
<html lang="en">
<head>
<script>window.ARCADE_GAME = "neon-2048";
// Curio: the shared layer every page loads (the hub and each game).
// One save ('arcade-v1') holds the player's level, daily missions and streak; each game keeps its own save untouched.
window.Arcade = (() => {
  const KEY = 'arcade-v1';
  const GAMES = [
    {id:'neon-2048', name:'Neon 2048', blurb:'Slide and merge tiles of light', color:'#ff8a3d', cat:'puzzle'},
    {id:'neon-blocks', name:'Neon Blocks', blurb:'Stack, clear and light up the well', color:'#ff4d8d', cat:'puzzle'},
    {id:'neon-orbit', name:'Neon Orbit', blurb:'Turn the ring, fire, light up the core', color:'#ffd23f', cat:'reflex'},
    {id:'neon-fuse', name:'Neon Fuse', blurb:'Turn the wires, keep the spark alive', color:'#3ee0c5', cat:'puzzle'},
    {id:'neon-tilt', name:'Neon Tilt', blurb:'Tilt the board, roll every ball home', color:'#5aa9ff', cat:'puzzle'},
    {id:'paper-echo', name:'Paper Echo', blurb:'Paper birds sing, you sing it back', color:'#f2b84b', cat:'calm'},
    {id:'afterimage', name:'Afterimage', blurb:'Your past self is right behind you', color:'#8f7bff', cat:'reflex'},
    {id:'halves', name:'Halves', blurb:'One swipe, two equal halves', color:'#ffd400', cat:'puzzle'},
    {id:'tightrope', name:'Tightrope', blurb:'Keep your balance high above the city', color:'#ff6b5b', cat:'reflex'},
    {id:'lily', name:'Lily', blurb:'A frog, a pond, a night of fireflies', color:'#e8c26a', cat:'reflex'},
    {id:'steep', name:'Steep', blurb:'A little tea house, poured by hand', color:'#d9733f', cat:'calm'},
    {id:'deckload', name:'Deckload', blurb:'Load her up, keep her level', color:'#e8a33a', cat:'physics'},
    {id:'tidepool', name:'Tidepool', blurb:'Send the tide, settle every creature', color:'#3fb8c4', cat:'puzzle'},
    {id:'kite', name:'Kite', blurb:'Ride the gusts, mind the line', color:'#ff7a59', cat:'reflex'},
    {id:'neon-pour', name:'Neon Pour', blurb:'Pour the light, sort every colour', color:'#c86bff', cat:'puzzle'},
    {id:'neon-bolts', name:'Neon Bolts', blurb:'Spin the nuts, light every bolt', color:'#3ee0c5', cat:'puzzle'},
    {id:'pottery', name:'Pottery', blurb:'Throw it, fire it, put it on the shelf', color:'#d9733f', cat:'calm'},
  ];
  // shelf tabs, in the order they appear
  const CATS = [{id:'puzzle', name:'Puzzle'}, {id:'reflex', name:'Reflex'}, {id:'calm', name:'Calm'}, {id:'physics', name:'Build'}];
  const byId = Object.fromEntries(GAMES.map(g => [g.id, g]));
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const dayNum = s => Math.round(new Date(s + 'T12:00:00').getTime() / 864e5);

  let S;
  function load(){
    try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ S = null; }
    S = Object.assign({xp:0, runs:{}, best:{}, played:0, streak:{last:'', days:0}, daily:null, last:null, noads:false, seen:false}, S || {});
  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
  load();

  // levels: each one asks a little more than the last
  const need = L => 100 + (L - 1) * 40;
  function level(){ let L = 1, x = S.xp; while (x >= need(L)){ x -= need(L); L++; } return {level:L, into:x, need:need(L)}; }

  // three missions a day, from three different games, the same for the whole day
  function rng(seed){ let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function daily(){
    const d = today();
    if (S.daily && S.daily.date === d) return S.daily;
    const R = rng(dayNum(d) * 7919), pool = GAMES.slice();
    for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(R() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const list = pool.slice(0, 3).map((g, i) => {
      const best = S.best[g.id] || 0, kind = i === 0 ? 'play' : best > 0 && R() < .6 ? 'score' : i === 2 ? 'best' : 'play';
      if (kind === 'score') return {game:g.id, kind, target:Math.max(1, Math.round(best * (.45 + R() * .2))), prog:0, done:false};
      if (kind === 'best') return {game:g.id, kind, target:1, prog:0, done:false};
      return {game:g.id, kind:'play', target:2 + Math.floor(R() * 2), prog:0, done:false};
    });
    S.daily = {date:d, list, bonus:false}; save(); return S.daily;
  }
  const missionText = m => { const n = byId[m.game].name;
    return m.kind === 'play' ? `Play ${m.target} rounds of ${n}` : m.kind === 'score' ? `Score ${m.target.toLocaleString('en-US')} in ${n}` : `Beat your best in ${n}`; };

  // a finished round from any game: XP, missions, streak
  function report(game, r){
    r = r || {}; const score = +r.score || 0, newBest = !!r.newBest;
    S.runs[game] = (S.runs[game] || 0) + 1; S.played++; S.last = game;
    if (score > (S.best[game] || 0)) S.best[game] = score;
    const before = level().level; let gain = 20 + (newBest ? 25 : 0); const done = [];
    for (const m of daily().list){ if (m.done || m.game !== game) continue;
      if (m.kind === 'play') m.prog++; else if (m.kind === 'score') m.prog = Math.max(m.prog, score); else if (newBest) m.prog = 1;
      if (m.prog >= m.target){ m.done = true; gain += 100; done.push(missionText(m)); } }
    if (!S.daily.bonus && S.daily.list.every(m => m.done)){ S.daily.bonus = true; gain += 150; done.push('All three missions'); }
    // a day with at least one finished round keeps the streak going
    const d = today(); if (S.streak.last !== d){ S.streak.days = S.streak.last && dayNum(d) - dayNum(S.streak.last) === 1 ? S.streak.days + 1 : 1; S.streak.last = d; }
    S.xp += gain; save();
    const after = level().level;
    return {gain, done, levelUp:after > before ? after : 0};
  }
  const streak = () => { const d = today(); return S.streak.last && dayNum(d) - dayNum(S.streak.last) <= 1 ? S.streak.days : 0; };
  return {GAMES, CATS, byId, get state(){ return S; }, level, daily, missionText, report, streak, save, reload:load};
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neon 2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Sora:wght@400;500;600;700&family=Neonderthaw&display=swap" rel="stylesheet">
<style>
/* HUD speaks the tiles' language: solid keycaps with a thick lower edge, no glass. The score is the one loud thing. */
:root{--night:#0e0a24;--panel:#1b1442;--key:#2b2163;--key-edge:#160f38;--orange:#ff8a3c;--orange-edge:#b4501a;--blue:#3a4888;--text:#efeaff;--dim:#a99fd6;
  --num:'Russo One',system-ui,sans-serif;--ui:'Sora',system-ui,sans-serif;--st:var(--safe-top,env(safe-area-inset-top,0px));--sb:var(--safe-bottom,env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--text);font-family:var(--ui);user-select:none;-webkit-user-select:none;touch-action:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.ft{position:absolute;left:0;top:0;font-family:var(--num);white-space:nowrap;transform:translate(-50%,-50%);will-change:transform,opacity}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:2px solid var(--orange);outline-offset:3px}

/* top: mode switch + best on one line, the score big underneath */
#hud{position:fixed;left:0;right:0;top:calc(var(--st) + 14px);display:flex;justify-content:center;pointer-events:none;z-index:2}
.bar{width:min(460px,calc(100vw - 32px));display:grid;grid-template-columns:1fr auto;align-items:end;row-gap:2px}
.modechip{pointer-events:auto;justify-self:start;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--dim);padding:4px 0}
.modechip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.modechip .grid{display:grid;gap:1.5px;width:16px;height:16px}
.modechip .grid i{background:var(--dim);border-radius:1px;opacity:.8}
.best{justify-self:end;font-size:15px;font-weight:500;color:var(--dim)}
.best b{font-family:var(--num);font-weight:400;color:var(--text);margin-left:4px}
.scoreline{grid-column:1 / -1;display:flex;align-items:baseline;gap:10px}
#score{font-family:var(--num);font-size:56px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;text-shadow:0 4px 0 var(--key-edge)}
#score.bump{animation:bump .28s}
@keyframes bump{40%{transform:translateY(-3px)}}

/* timer: a plain track under the score */
#timer{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 104px);width:min(460px,calc(100vw - 32px));height:8px;border-radius:4px;background:var(--panel);overflow:hidden;z-index:2}
#timer i{display:block;height:100%;width:100%;background:var(--blue);border-radius:4px;transition:width .2s linear}
#timer.low i{background:var(--orange)}
#timerText{position:fixed;z-index:2;right:calc((100vw - min(460px,100vw - 32px)) / 2);top:calc(var(--st) + 56px);font-family:var(--num);font-weight:400;font-size:30px;line-height:1;color:var(--text);font-variant-numeric:tabular-nums}
#timerText.low{color:var(--orange)}

/* keycaps */
.key{height:52px;min-width:52px;padding:0 16px;border-radius:14px;display:inline-grid;place-items:center;background:var(--key);box-shadow:0 5px 0 var(--key-edge);font-weight:600;font-size:15px;transition:transform .07s,box-shadow .07s}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--key-edge)}
.key:disabled{opacity:.35;pointer-events:none}
.key svg{width:22px;height:22px;fill:none;stroke:var(--text);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.key.primary{background:var(--orange);box-shadow:0 5px 0 var(--orange-edge);color:#2a1100;font-family:var(--num);font-weight:400;font-size:18px;padding:0 28px}
.key.primary:active{box-shadow:0 1px 0 var(--orange-edge)}
#soundBtn.off svg .wave,#homeSound.off svg .wave{display:none}#soundBtn svg .x,#homeSound svg .x{display:none}#soundBtn.off svg .x,#homeSound.off svg .x{display:inline}
#bottom{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 22px);display:flex;justify-content:center;align-items:center;gap:10px;z-index:2}
#hint{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 92px);z-index:2;text-align:center;font-size:13px;color:var(--dim);transition:opacity .6s}

/* power cards sit above the keys like two spare tiles */
#powers{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 92px);display:flex;justify-content:center;gap:10px;z-index:2}
.pcard{position:relative;height:44px;padding:0 16px;border-radius:12px;display:flex;align-items:center;gap:8px;background:var(--panel);box-shadow:0 4px 0 var(--key-edge);font-weight:600;font-size:14px;transition:transform .07s}
.pcard .pi{display:grid}
.pcard em{font-style:normal;font-family:var(--num);color:var(--dim)}
.pcard:disabled{opacity:.35}
.pcard.on{background:var(--orange);color:#2a1100;box-shadow:0 4px 0 var(--orange-edge)}.pcard.on em{color:#2a1100}
#tip{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 120px);z-index:3;padding:8px 14px;border-radius:10px;background:var(--panel);font-size:14px;font-weight:500;white-space:nowrap}

/* sheets: game over + modes. Solid panels, sentence case. */
#overlay,#modes{position:fixed;inset:0;z-index:5;display:grid;place-items:end center;padding:16px 12px calc(var(--sb) + 12px);background:rgba(8,5,22,.62);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card,.mwrap{width:min(460px,100%);background:var(--panel);border-radius:22px;padding:22px 20px 18px;box-shadow:0 -2px 0 rgba(255,255,255,.04) inset;animation:up .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.card{display:grid;gap:16px}
.card h2{margin:0;font-family:var(--num);font-weight:400;font-size:32px;line-height:1.05}
.card h2.win{color:#ffd84a}.card h2.lose{color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-radius:14px;background:var(--night);padding:12px 4px}
.stats div{text-align:center}
.stats div + div{border-left:1px solid #2a2256}
.stats small{display:block;font-size:12px;color:var(--dim)}
.stats b{font-family:var(--num);font-weight:400;font-size:22px}
.row{display:flex;gap:10px}.row .key{flex:1}
.link{justify-self:center;font-size:14px;color:var(--dim);text-decoration:underline;text-underline-offset:3px}
.card .key.wide{width:100%}
#modes{place-items:end center}
.mwrap{max-height:calc(100% - var(--st));overflow:auto;display:grid;gap:4px;padding:18px 12px 12px}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:0 8px 8px}
.mhead h2{margin:0;font-family:var(--num);font-weight:400;font-size:24px}
.key.small{height:40px;min-width:40px;padding:0;border-radius:12px}
.key.small svg{width:18px;height:18px}
.mgrid{display:grid;gap:4px}
.mcard{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;text-align:left;padding:12px 10px;border-radius:14px;position:relative}
.mcard:active{background:#241b52}
.mcard.cur{background:#241b52}
.mcard.cur::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--orange)}
.mcard .glyph{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;background:var(--night);font-size:20px}
.mcard .glyph .g{display:grid;gap:2px;width:26px;height:26px}
.mcard .glyph .g i{background:var(--blue);border-radius:2px}
.mcard .glyph .g i.r{background:#5a5276}
.mcard b{display:block;font-weight:600;font-size:16px}
.mcard p{margin:2px 0 0;font-size:13px;color:var(--dim);line-height:1.35}
.mcard .bst{text-align:right;font-family:var(--num);font-size:16px;color:var(--text)}
.mcard .bst small{display:block;font-family:var(--ui);font-size:11px;color:var(--dim)}
.mcard .resume{font-size:11px;color:var(--orange);font-weight:600}
/* new-zone banner */
.zone{position:fixed;left:0;right:0;top:40%;z-index:3;text-align:center;font-family:var(--num);font-size:34px;pointer-events:none;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35);animation:zone 2.6s ease forwards}
.zone small{display:block;font-family:var(--ui);font-weight:500;font-size:14px;color:var(--dim);margin-bottom:6px}
@keyframes zone{0%{opacity:0;transform:translateY(10px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#splash{position:fixed;inset:0;z-index:20;background:var(--night);display:grid;place-items:center;transition:opacity .5s ease,transform .5s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .mark{display:grid;justify-items:center;gap:26px}
#splash .word{font-family:var(--num);font-size:52px;line-height:1;color:var(--text);text-shadow:0 5px 0 var(--key-edge)}
#splash .word b{font-weight:400;color:var(--orange)}
#splash .blocks{display:flex;gap:10px;height:64px;align-items:flex-end}
#splash .blk{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-family:var(--num);font-size:24px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.35);opacity:0;transform:translateY(-40px);animation:drop .45s cubic-bezier(.3,1.5,.5,1) forwards}
#splash .blk:nth-child(1){background:#3a4888;animation-delay:.15s}#splash .blk:nth-child(2){background:#ff8a3c;animation-delay:.3s}
#splash .blk:nth-child(3){background:#9b5cff;animation-delay:.45s}#splash .blk:nth-child(4){background:#ffc93a;color:#4a2400;font-size:17px;animation-delay:.6s}
@keyframes drop{to{opacity:1;transform:none}}
#splash .bar{width:180px;height:6px;border-radius:3px;background:var(--panel);overflow:hidden}
#splash .bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--orange);transition:width .3s}
/* logo: a neon-sign 'Neon' over the four digits as game tiles */
.logo2{display:grid;justify-items:center;gap:2px}
.logo2 .tube{font-family:'Neonderthaw',cursive;font-size:84px;line-height:.9;color:#ffe6f7;
  text-shadow:0 0 4px #fff,0 0 10px #ff4fd8,0 0 22px #ff4fd8,0 0 44px #ff2fb8;animation:flick 1.6s .4s both}
@keyframes flick{0%,8%,12%,22%{opacity:.15;text-shadow:none}10%,20%,100%{opacity:1}}
.logo2 .tiles{display:flex;gap:8px}
.logo2 .tiles i{font-style:normal;width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-family:var(--num);font-size:42px;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.35);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.logo2 .tiles i:nth-child(1){background:#3a4888;transform:translateY(6px) rotate(-4deg)}
.logo2 .tiles i:nth-child(2){background:#9b5cff;transform:rotate(2deg)}
.logo2 .tiles i:nth-child(3){background:#ff8a3c;transform:translateY(4px) rotate(-2deg)}
.logo2 .tiles i:nth-child(4){background:#ffc93a;color:#4a2400;transform:translateY(-2px) rotate(4deg)}
.logo2.small .tube{font-size:62px}
#splash .logo2 .tiles i{opacity:0;animation:tileIn .45s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes tileIn{from{opacity:0;translate:0 -40px}to{opacity:1;translate:0 0}}
#splash .logo2 .tiles i:nth-child(2){animation-delay:.12s}#splash .logo2 .tiles i:nth-child(3){animation-delay:.24s}#splash .logo2 .tiles i:nth-child(4){animation-delay:.36s}.logo2.small .tiles i{width:48px;height:48px;font-size:30px;border-radius:11px}

/* home: the scene keeps floating behind; wordmark up top, the mode and the play key at thumb height */
#home{position:fixed;inset:0;z-index:4;display:grid;grid-template-rows:auto auto 1fr auto;padding:calc(var(--st) + 10px) 0 calc(var(--sb) + 22px);background:radial-gradient(120% 70% at 50% 35%,rgba(14,10,36,0),rgba(14,10,36,.55))}
#homeTop{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:0 16px;min-height:44px}
#homeTop .key{height:42px;min-width:42px;padding:0 10px;border-radius:12px}
#homeTop .key svg{width:20px;height:20px}
#home .word{justify-self:center;text-align:center;margin-top:8px}
#home .word small{display:block;font-family:var(--ui);font-weight:500;font-size:15px;color:var(--dim);margin-top:20px}
/* the shelf: one card per mode, the centred card is the one Play starts */
#shelf{align-self:center;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px calc(50vw - 115px) 22px;scrollbar-width:none;touch-action:pan-x}
#shelf::-webkit-scrollbar{display:none}
.mcard2{flex:0 0 230px;scroll-snap-align:center;border-radius:22px;padding:16px;background:var(--panel);box-shadow:0 6px 0 var(--key-edge);text-align:left;display:grid;gap:10px;transition:transform .25s,opacity .25s;opacity:.55;transform:scale(.92)}
.mcard2.on{opacity:1;transform:none}
.mcard2 .mini{position:relative;aspect-ratio:1;border-radius:14px;background:var(--night);padding:10px;display:grid;gap:5px}
.mcard2 .mini i{border-radius:5px;background:#1d1648;display:grid;place-items:center;font-family:var(--num);font-size:12px;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.mcard2 .mini i.r{background:#4d4568}
.mcard2 .mini .badge{position:absolute;right:-6px;top:-6px;width:38px;height:38px;border-radius:12px;background:var(--orange);color:#2a1100;display:grid;place-items:center;box-shadow:0 4px 0 var(--orange-edge)}
.mcard2 .mini .badge svg{width:22px;height:22px}
.mcard2 b{font-weight:600;font-size:19px}
.mcard2 p{margin:-6px 0 0;font-size:13px;color:var(--dim);line-height:1.35;min-height:36px}
.mcard2 .meta{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--dim)}
.mcard2 .meta span b{font-family:var(--num);font-weight:400;font-size:17px;color:var(--text);margin-left:4px}
.mcard2 .meta em{font-style:normal;color:var(--orange);font-weight:600}
#dots{display:flex;justify-content:center;gap:7px;margin-top:-6px}
#dots i{width:7px;height:7px;border-radius:4px;background:#3a3170;transition:width .2s,background .2s}
#dots i.on{width:20px;background:var(--orange)}
#home .bottomset{width:min(420px,calc(100% - 32px));justify-self:center;display:grid;gap:14px}
#playBtn{height:64px;font-size:24px;width:100%}
/* short screens (iPhone SE and older): smaller logo and cards so Play stays on screen */
@media (max-height:700px){
  #home .word{margin-top:0}#home .word small{display:none}
  #home .logo2 .tube{font-size:58px}#home .logo2 .tiles i{width:44px;height:44px;font-size:28px;border-radius:10px}

<script>// Runs inside each game page, after the game's own code. It adds a way back to the arcade and turns finished rounds into XP.
(() => {
  const GAME = window.ARCADE_GAME, A = window.Arcade, P = window.PLATFORM || (window.PLATFORM = {});
  if (!GAME || !A) return;
  A.state.last = GAME; A.save();

  // back to the arcade: a key in the game's own top bar, drawn in that game's own style
  const top = document.getElementById('homeTop');
  if (top){
    // borrow the class of the game's own top-bar buttons ('key' in most games, 'chip' in Tightrope)
    const own = top.querySelector('button'), cls = own && own.classList.contains('chip') ? 'chip' : 'key';
    const b = document.createElement('button'); b.className = cls; b.id = 'arcadeBack'; b.setAttribute('aria-label', 'Back to all games');
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6 8.5 12l6 6"/></svg><span>Games</span>';
    b.onclick = e => { e.stopPropagation(); location.href = '../index.html'; };
    top.prepend(b);
    // Tightrope's chips are light-on-dark: its icons are white, so the label is too
    if (cls === 'chip') b.style.color = '#fff';
  }
  const css = document.createElement('style');
  css.textContent = `#arcadeBack{margin-right:auto;display:inline-flex;align-items:center;gap:4px;padding:0 14px 0 8px!important;font-weight:700;font-size:15px}
    #arcadeBack svg{width:20px;height:20px}
    #homeTop{justify-content:flex-end}
    .arcadeToast{position:fixed;left:50%;top:calc(var(--safe-top, env(safe-area-inset-top, 0px)) + 14px);transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;
      font:700 14px/1.2 system-ui,-apple-system,sans-serif;color:#fff;animation:arcIn .35s cubic-bezier(.2,1.4,.4,1) both, arcOut .4s ease 3.4s forwards}
    .arcadeToast b{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:rgba(20,18,40,.88);box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap}
    .arcadeToast b i{font-style:normal;color:#ffd23f}
    .arcadeToast small{padding:6px 12px;border-radius:999px;background:rgba(62,224,197,.92);color:#0d2a26;font-weight:800;white-space:nowrap}
    @keyframes arcIn{from{opacity:0;transform:translate(-50%,-14px) scale(.9)}}
    @keyframes arcOut{to{opacity:0;transform:translate(-50%,-10px)}}`;
  // no text selection, magnifier loupe or callout on a long press in any game (iOS shows them on plain text otherwise)

  document.head.appendChild(css);

  // every finished round counts toward the player's arcade level and today's missions

    let res = null; try { res = A.report(GAME, r); } catch(e){}

    }, 900);

  };
})();
